<!doctype html>
<html lang="es" style="width: 100%">
  <head>
    <meta charset="utf-8" />
    <title>Banter Privacy Consent — NitroPay CMP</title>
    <script type="text/javascript">
      window.__npcmp_display_mode = 'app';
    </script>
    <script data-cfasync="false" async src="https://consent.nitrocnct.com/loader.js"></script>
  </head>
  <body style="width: 100%; margin: 0; background: transparent">
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const resurface = urlParams.get('resurface');
      function callback(tcData) {
        if (tcData && tcData.eventStatus === 'useractioncomplete') {
          window.close();
        }
      }
      function checkCmp() {
        if (window.__cmp) {
          if (resurface) {
            window.__cmp('showModal');
          } else {
            window.__cmp('showConsentTool');
          }
          if (window.__tcfapi) window.__tcfapi('addEventListener', 2, callback);
          return;
        }
        if (typeof window.__npcmp_gdpr !== 'undefined' && !window.__npcmp_gdpr) {
          window.close();
          return;
        }
        setTimeout(checkCmp, 100);
      }
      if (!resurface) {
        window.__tcfapi_queue = [['addEventListener', 2, callback]];
      }
      checkCmp();
    </script>
  </body>
</html>
